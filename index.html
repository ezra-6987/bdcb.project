<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Asset Quest</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ================================================= -->
    <!-- START SCREEN -->
    <!-- ================================================= -->

    <div id="startScreen">

        <h3>Speed Sorting</h3>

        <h1>Asset Quest</h1>

        <button id="startButton">
            START
        </button>

        <p>
            Pick the right assets!
        </p>

    </div>



    <!-- ================================================= -->
    <!-- GAME SCREEN -->
    <!-- ================================================= -->

    <div id="gameScreen">


        <!-- ================= TOP BAR ================= -->

        <div id="topBar">

            <div id="timer">
                ⏱ 40
            </div>


            <div id="score">
                0 / 13
            </div>


            <div id="lives">
                ❤️❤️❤️
            </div>

        </div>



        <!-- ================================================= -->
        <!-- CORRECT / WRONG MESSAGE -->
        <!-- ================================================= -->

        <div id="message"></div>



        <!-- ================================================= -->
        <!-- CONVEYOR -->
        <!-- ================================================= -->

        <div id="cardContainer">

            <div id="conveyorArea">


                <!-- Conveyor background -->

                <img
                    src="images/conveyor.jpg"
                    id="conveyorImage"
                    alt=""
                >


                <!-- Cards are inserted here by JavaScript -->

                <div id="belt"></div>


            </div>

        </div>



        <!-- ================================================= -->
        <!-- DROP FOLDERS -->
        <!-- ================================================= -->

        <div id="dropArea">


            <!-- ================= COLLATERALISED ================= -->

            <div
                class="folder"
                id="collateral"
                data-category="Collateralised"
            >

                <img
                    src="images/Collateral.png"
                    class="folderImage"
                    id="collateralImage"
                    alt="Collateralised Items"
                >

            </div>



            <!-- ================= NON-COLLATERALISED ================= -->

            <div
                class="folder"
                id="nonCollateral"
                data-category="Non-Collateralised"
            >

                <img
                    src="images/Non-Collateral.png"
                    class="folderImage"
                    id="nonCollateralImage"
                    alt="Non-Collateralised Items"
                >

            </div>


        </div>


    </div>



    <!-- ================================================= -->
    <!-- GAME OVER -->
    <!-- ================================================= -->

    <div id="gameOver">

        <h1>🎉 Game Over</h1>

        <h2 id="finalScore">
            Score: 0 / 13
        </h2>

        <button id="playAgain">
            PLAY AGAIN
        </button>

    </div>



    <!-- ================================================= -->
    <!-- CONFETTI -->
    <!-- ================================================= -->

    <div id="confetti"></div>



    <!-- ================================================= -->
    <!-- SOUND EFFECTS -->
    <!-- ================================================= -->

    <audio
        id="correctSound"
        src="sounds/correct.mp3"
    ></audio>


    <audio
        id="wrongSound"
        src="sounds/wrong.mp3"
    ></audio>


    <audio
        id="gameOverSound"
        src="sounds/gameover.mp3"
    ></audio>


    <audio
        id="clickSound"
        src="sounds/click.mp3"
    ></audio>



    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->

    <script src="script.js"></script>


</body>

</html>
