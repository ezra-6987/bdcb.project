<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asset Quest</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ========================= -->
    <!-- START SCREEN -->
    <!-- ========================= -->

    <div id="startScreen">

        <h3>Speed Sorting</h3>

        <h1>Asset Quest</h1>

        <button id="startButton">
            START
        </button>

        <p>
            Separate the assets into the correct folders.
        </p>

    </div>


    <!-- ========================= -->
    <!-- GAME SCREEN -->
    <!-- ========================= -->

    <div id="overlay">

        <div id="gameScreen">

            <!-- Top Bar -->

            <div id="topBar">

                <div id="timer">
                    ⏱ 40
                </div>

                <div id="score">
                    0 / 18
                </div>

                <div id="lives">
                    ❤️❤️❤️
                </div>

            </div>


            <!-- Floating Correct/Wrong Message -->

            <div id="message"></div>


            <!-- Card Area -->

            <div id="cardContainer">

                <div id="conveyorArea">

                    <div id="movingConveyor">

                        <img
                            src="images/conveyor.jpg" 
                            id="conveyorImage"
                        >

                        <div id="belt">

                            <div class="slot" id="slot1"></div>

                            <div class="slot" id="slot2"></div>

                            <div class="slot" id="slot3"></div>

                            <div class="slot" id="slot4"></div>

                            <div class="slot" id="slot5"></div>

                            <div class="slot" id="slot6"></div>

                            <div class="slot" id="slot7"></div>

                            <div class="slot" id="slot8"></div>

                            <div class="slot" id="slot9"></div>

                            <div class="slot" id="slot10"></div>

                            <div class="slot" id="slot11"></div>

                            <div class="slot" id="slot12"></div>

                            <div class="slot" id="slot13"></div>

                           
                        </div>

                        
                    </div>   

                </div>
            </div>

            <!-- Drop Folders -->

            <div id="dropArea">

                <div id="progress">

                    0 of 13

                </div>

                <div
                    class="folder"
                    id="collateral"
                    data-category="Collateralised">

                    <img
                            src="images/Collateral.png" 
                            class="folderImage"
                            alt="Collateralised"
                            
                    >

                    <span>
                        Collateralised Items
                    </span>

                </div>

                <div
                    class="folder"
                    id="nonCollateral"
                    data-category="Non-Collateralised">

                    <img
                            src="images/Non-Collateral.png" 
                            class="folderImage"
                            alt="Non-Collateralised"
                            
                    >

                    <span>
                        Non-Collateralised Items
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- CONFETTI -->
    <!-- ========================= -->

    <div id="confetti"></div>


    <!-- ========================= -->
    <!-- GAME OVER -->
    <!-- ========================= -->

    <div id="gameOver">

        <h1>🎉 Game Over</h1>

        <h2 id="finalScore">
            Score : 0 / 13
        </h2>

        <button id="playAgain">
            Play Again
        </button>

    </div>


    <!-- ========================= -->
    <!-- SOUND EFFECTS -->
    <!-- ========================= -->

    <audio id="correctSound" src="sounds/correct.mp3"></audio>

    <audio id="wrongSound" src="sounds/wrong.mp3"></audio>

    <audio id="gameOverSound" src="sounds/gameover.mp3"></audio>

    <audio id="clickSound" src="sounds/click.mp3"></audio>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="script.js"></script>

</body>

</html>
