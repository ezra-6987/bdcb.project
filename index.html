<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asset Quest</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ========================= -->
    <!-- START SCREEN -->
    <!-- ========================= -->

    <div id="startScreen">

        <h3>Speed Sorting</h3>

        <h1>Asset Quest</h1>

        <button id="startButton">
            START
        </button>

        <p>
            Separate the assets into the correct folders.
        </p>

    </div>


    <!-- ========================= -->
    <!-- GAME SCREEN -->
    <!-- ========================= -->

    <div id="overlay">

        <div id="gameScreen">

            <!-- Top Bar -->

            <div id="topBar">

                <div id="timer">
                    ⏱ 40
                </div>

                <div id="score">
                    0 / 18
                </div>

                <div id="lives">
                    ❤️❤️❤️
                </div>

            </div>


            <!-- Floating Correct/Wrong Message -->

            <div id="message"></div>


            <!-- Card Area -->

            <div id="cardContainer">

                <!-- Film Strip -->

               <div id="filmStrip">

                    <div id="belt">

                     <!-- Generated by JavaScript -->

               </div>

            </div>


            <!-- Drop Folders -->

            <div id="dropArea">

                <div id="progress">

                    0 of 18

                </div>

                <div
                    class="folder"
                    id="collateral"
                    data-category="Collateralised">

                    📁

                    <span>
                        Collateralised Items
                    </span>

                </div>

                <div
                    class="folder"
                    id="nonCollateral"
                    data-category="Non-Collateralised">

                    📁

                    <span>
                        Non-Collateralised Items
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- CONFETTI -->
    <!-- ========================= -->

    <div id="confetti"></div>


    <!-- ========================= -->
    <!-- GAME OVER -->
    <!-- ========================= -->

    <div id="gameOver">

        <h1>🎉 Game Over</h1>

        <h2 id="finalScore">
            Score : 0 / 18
        </h2>

        <button id="playAgain">
            Play Again
        </button>

    </div>


    <!-- ========================= -->
    <!-- SOUND EFFECTS -->
    <!-- ========================= -->

    <audio id="correctSound" src="sounds/correct.mp3"></audio>

    <audio id="wrongSound" src="sounds/wrong.mp3"></audio>

    <audio id="gameOverSound" src="sounds/gameover.mp3"></audio>

    <audio id="clickSound" src="sounds/click.mp3"></audio>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="script.js"></script>

</body>

</html>
